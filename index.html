<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>النتيجة العامة لنظام الفصول</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eee;
    font-family:Tahoma,Arial,sans-serif;
    color:#111;
}

.hidden{
    display:none!important;
}


/* ================= LOGIN ================= */

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 20px #aaa;
    text-align:center;
}

.login-box h1{
    margin:0 0 25px;
    color:#1d4ed8;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    font-size:16px;
    direction:ltr;
    text-align:left;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    background:#1d4ed8;
    color:white;
    font-size:17px;
    cursor:pointer;
    border-radius:4px;
}

#error{
    color:red;
    margin-top:10px;
    min-height:20px;
}


/* ================= PAGE ================= */

.page{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    background:#eee;
}

.topbar{
    height:44px;
    background:linear-gradient(#596772,#252d33);
    color:white;
    font-size:20px;
    font-weight:bold;
    padding:9px 10px;
}

.student-info{
    background:#ddd;
    border:1px solid #aaa;
    padding:9px;
    font-weight:bold;
}


/* ================= TABLE ================= */

.result-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    direction:rtl;
    margin:0;
}

.result-table td,
.result-table th{
    border:1px solid #c6bebe;
    height:32px;
    padding:5px;
    text-align:center;
    font-size:13px;
}

.subject{
    width:29%;
    text-align:right!important;
    padding-right:14px!important;
}

.space{
    width:17%;
    background:#eee;
}

.score,
.max,
.grade{
    width:9%;
}

.year{
    background:#ff6659!important;
    font-weight:bold;
    font-size:15px!important;
    height:34px!important;
}

.total{
    background:#c9bebc;
    font-weight:bold;
}

.weak{
    background:#fff477!important;
}


/* ================= ADMIN ================= */

.adminbar{
    background:#ddd;
    border:1px solid #aaa;
    padding:10px;
    position:sticky;
    top:0;
    z-index:20;
}

.adminbar button{
    border:0;
    padding:9px 14px;
    margin:3px;
    color:white;
    background:#555;
    cursor:pointer;
    border-radius:3px;
}

.save{
    background:#168b45!important;
}

.add{
    background:#e85d4d!important;
}

.delete{
    background:#a82222!important;
}

.addsubject{
    background:#168b45!important;
}

.addstage{
    background:#e85d4d!important;
}

.edit{
    width:95%;
    padding:5px;
    border:1px solid #888;
    background:white;
    text-align:center;
    font-family:Tahoma,Arial;
    font-size:12px;
}

.edit-subject{
    width:95%;
}

.admin-note{
    background:#fff8dc;
    border:1px solid #ddd;
    padding:10px;
    margin:10px;
    text-align:center;
    font-size:13px;
}

.footer{
    text-align:center;
    background:#ddd;
    border:1px solid #aaa;
    padding:12px;
    font-weight:bold;
    font-size:15px;
}

.logout{
    margin:15px;
    padding:9px 20px;
    background:#555;
    color:white;
    border:0;
    cursor:pointer;
    border-radius:3px;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .topbar{
        font-size:15px;
    }

    .result-table td,
    .result-table th{
        font-size:9px;
        height:30px;
        padding:3px;
    }

    .year{
        font-size:11px!important;
    }

    .edit{
        font-size:9px;
        padding:3px;
    }

}

</style>

</head>
