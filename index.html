*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eee;
    font-family:Tahoma,Arial,sans-serif;
    color:#111;
}

.hidden{
    display:none!important;
}


/* ================= LOGIN ================= */

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 20px #aaa;
    text-align:center;
}

.login-box h1{
    margin:0 0 25px;
    color:#1d4ed8;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    font-size:16px;
    direction:ltr;
    text-align:left;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    background:#1d4ed8;
    color:white;
    font-size:17px;
    cursor:pointer;
    border-radius:4px;
}

#error{
    color:red;
    margin-top:10px;
    min-height:20px;
}


/* ================= PAGE ================= */

.page{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    background:#eee;
}

.topbar{
    height:44px;
    background:linear-gradient(#596772,#252d33);
    color:white;
    font-size:20px;
    font-weight:bold;
    padding:9px 10px;
}

.student-info{
    background:#ddd;
    border:1px solid #aaa;
    padding:9px;
    font-weight:bold;
}


/* ================= TABLE ================= */

.result-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    direction:rtl;
    margin:0;
}

.result-table td,
.result-table th{
    border:1px solid #c6bebe;
    height:32px;
    padding:5px;
    text-align:center;
    font-size:13px;
}

.subject{
    width:29%;
    text-align:right!important;
    padding-right:14px!important;
}

.space{
    width:17%;
    background:#eee;
}

.score,
.max,
.grade{
    width:9%;
}

.year{
    background:#ff6659!important;
    font-weight:bold;
    font-size:15px!important;
    height:34px!important;
}

.total{
    background:#c9bebc;
    font-weight:bold;
}

.weak{
    background:#fff477!important;
}


/* ================= ADMIN ================= */

.adminbar{
    background:#ddd;
    border:1px solid #aaa;
    padding:10px;
    position:sticky;
    top:0;
    z-index:20;
}

.adminbar button{
    border:0;
    padding:9px 14px;
    margin:3px;
    color:white;
    background:#555;
    cursor:pointer;
    border-radius:3px;
}

.save{
    background:#168b45!important;
}

.add{
    background:#e85d4d!important;
}

.delete{
    background:#a82222!important;
}

.addsubject{
    background:#168b45!important;
}

.addstage{
    background:#e85d4d!important;
}

.edit{
    width:95%;
    padding:5px;
    border:1px solid #888;
    background:white;
    text-align:center;
    font-family:Tahoma,Arial;
    font-size:12px;
}

.edit-subject{
    width:95%;
}

.admin-note{
    background:#fff8dc;
    border:1px solid #ddd;
    padding:10px;
    margin:10px;
    text-align:center;
    font-size:13px;
}

.footer{
    text-align:center;
    background:#ddd;
    border:1px solid #aaa;
    padding:12px;
    font-weight:bold;
    font-size:15px;
}

.logout{
    margin:15px;
    padding:9px 20px;
    background:#555;
    color:white;
    border:0;
    cursor:pointer;
    border-radius:3px;

/* =====================================================
   حماية النصوص
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function showPage(id){

    document

    document
        .getElementById("studentPage")
        .classList.add("hidden");

    document
        .getElementById("adminPage")
        .classList.add("hidden");


    document
        .getElementById(id)
        .classList.remove("hidden");

}

                : "";


            html += `

            <tr class="${weak}">

                <td class="subject">

                    ${escapeHTML(s.name)}

                </td>


                <td class="space"></td>


                <td class="score">

                    ${escapeHTML(s.score1 || "")}

                </td>


                <td class="max">

                    ${escapeHTML(s.max1 || "")}

                </td>


                <td class="grade">

                    ${escapeHTML(s.grade1 || "")}

                </td>


                <td class="score">

                    ${escapeHTML(s.score2 || "")}

                </td>


                <td class="max">

                    ${escapeHTML(s.max2 || "")}

                </td>


                <td class="grade">

                    ${escapeHTML(s.grade2 || "")}

                </td>

            </tr>

            `;

        });


        if(
            stage.subjects &&
            stage.subjects.length
        ){

            html += `

            <tr class="total">

                <td class="subject">
                    المجموع الكلي
                </td>

                <td class="space"></td>

                <td colspan="2">

                    ${escapeHTML(
                        stage.total || ""
                    )}

                </td>

                <td>

                    التقدير الكلي

                </td>

                <td colspan="2"></td>

                <td>

                    ${escapeHTML(
                        stage.totalGrade || ""
                    )}

                </td>

            </tr>

            `;

        }


        html += `

        </table>

        `;

    });


    html += `

        <div class="footer">

            هذه الصفحة لعرض النتيجة
            وليست شهادة رسمية

        </div>

    `;


    document
        .getElementById("studentResults")
        .innerHTML = html;

}



/* =====================================================
   لوحة المدير
===================================================== */

function showAdmin(){

    let html = "";


    results.forEach((stage,si)=>{

        html += `

        <table class="result-table">

            <tr>

                <td
                    colspan="8"
                    class="year"
                >

                    <input

                        class="edit"

                        value="${escapeHTML(
                            stage.name
                        )}"

                        data-stage-name="${si}"

                    >

                </td>

            </tr>


            <tr>

                <th class="subject">
                    اسم المادة
                </th>

                <th class="space"></th>

                <th class="score">
                    الدرجة المحصلة
                </th>

                <th class="max">
                    الدرجة الكلية
                </th>

                <th class="grade">
                    التقدير
                </th>

                <th class="score">
                    الدرجة المحصلة
                </th>

                <th class="max">
                    الدرجة الكلية
                </th>

                <th class="grade">
                    التقدير
                </th>

            </tr>

        `;


        (stage.subjects || [])
        .forEach((s,ri)=>{

            html += `

            <tr>

                <td class="subject">

                    <input

                        class="edit edit-subject"

                        value="${escapeHTML(
                            s.name
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="name"

                    >

                </td>


                <td class="space"></td>


                <td>

                    <input

                        class="edit"

                        value="${escapeHTML(
                            s.score1 || ""
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="score1"

                    >

                </td>


                <td>

                    <input

                        class="edit"

                        value="${escapeHTML(
                            s.max1 || ""
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="max1"

                    >

                </td>


                <td>

                    <input

                        class="edit"

                        value="${escapeHTML(
                            s.grade1 || ""
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="grade1"

                    >

                </td>


                <td>

                    <input

                        class="edit"

                        value="${escapeHTML(
                            s.score2 || ""
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="score2"

                    >

                </td>


                <td>

                    <input

                        class="edit"

                        value="${escapeHTML(
                            s.max2 || ""
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="max2"

                    >

                </td>


                <td>

                    <input

                        class="edit"

                        value="${escapeHTML(
                            s.grade2 || ""
                        )}"

                        data-si="${si}"

                        data-ri="${ri}"

                        data-key="grade2"

                    >

                </td>

            </tr>

            `;

        });


        html += `

            <tr>

                <td colspan="8">

                    <button

                        class="adminbar button addsubject"

                        onclick="addSubject(${si})"

                    >

                        + إضافة مادة

                    </button>


                    <button

                        class="adminbar button addstage"

                        onclick="insertStage(${si})"

                    >

                        + إضافة مرحلة قبلها

                    </button>


                    <button

                        class="adminbar button delete"

                        onclick="deleteStage(${si})"

                    >

                        حذف المرحلة

                    </button>

                </td>

            </tr>


        </table>

        `;

    });


    document
        .getElementById("adminResults")
        .innerHTML = html;



    /* اسم المرحلة */

    document
        .querySelectorAll(
            "[data-stage-name]"
        )
        .forEach(input=>{

            input.addEventListener(
                "change",
                function(){

                    const index =
                        Number(
                            this.dataset.stageName
                        );


                    results[index].name =
                        this.value;

                }
            );

        });



    /* بيانات المادة */

    document
        .querySelectorAll("[data-key]")
        .forEach(input=>{

            input.addEventListener(
                "change",
                function(){

                    const si =
                        Number(
                            this.dataset.si
                        );


                    const ri =
                        Number(
                            this.dataset.ri
                        );


                    const key =
                        this.dataset.key;


                    results[si]
                        .subjects[ri][key] =
                            this.value;

                }
            );

        });

}



/* =====================================================
   إضافة مادة
===================================================== */

function addSubject(stageIndex){

    results[stageIndex]
        .subjects
        .push({

            name:"مادة جديدة",

            score1:"",
            max1:"",
            grade1:"",

            score2:"",
            max2:"",
            grade2:""

        });


    showAdmin();

}



/* =====================================================
   إضافة مرحلة
===================================================== */

function addStage(){

    const name =
        prompt(
            "اكتب اسم المرحلة الجديدة"
        );


    if(!name){
        return;
    }


    results.push({

        name:name,

        subjects:[]

    });


    showAdmin();

}



/* =====================================================
   إضافة مرحلة قبل مرحلة
===================================================== */

function insertStage(index){

    const name =
        prompt(
            "اكتب اسم المرحلة الجديدة"
        );


    if(!name){
        return;
    }


    results.splice(
        index,
        0,
        {
            name:name,
            subjects:[]
        }
    );


    showAdmin();

}



/* =====================================================
   حذف مرحلة
===================================================== */

function deleteStage(index){

    if(
        confirm(
            "هل تريد حذف هذه المرحلة؟"
        )
    ){

        results.splice(
            index,
            1
        );


        showAdmin();

    }

}



/* =====================================================
   حفظ
===================================================== */

function saveData(){

    try{

        localStorage.setItem(
            "resultsSystemData",
            JSON.stringify(results)
        );


        alert(
            "تم حفظ التعديلات بنجاح"
        );

    }

    catch(e){

        alert(
            "حدث خطأ أثناء الحفظ"
        );

    }

}



/* =====================================================
   تسجيل الخروج
===================================================== */

function logout(){

    location.reload();

}

            }

        }
    );


document
    .getElementById("studentLogout")
    .addEventListener(
        "click",

    );


document
    .getElementById("adminLogout")
    .addEventListener(
        "click",
        logout
    );


document
    .getElementById("addStageButton")
    .addEventListener(
        "click",
        addStage
    );


document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        saveData
    );

</script>
