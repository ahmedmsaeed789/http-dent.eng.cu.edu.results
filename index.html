<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#eeeeee;
    font-family:Tahoma,Arial,sans-serif;
    color:#111;
}

body{
    min-height:100vh;
}

.hidden{
    display:none!important;
}


/* =====================================================
   LOGIN
===================================================== */

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eeeeee;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:8px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    text-align:center;
}

.login-box h1{
    margin:0 0 25px;
    color:#1d4ed8;
    font-size:26px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #bbb;
    font-size:16px;
    direction:ltr;
    text-align:left;
    border-radius:3px;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    background:#1d4ed8;
    color:white;
    font-size:17px;
    cursor:pointer;
    border-radius:4px;
}

#error{
    color:#d00000;
    margin-top:10px;
    min-height:20px;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100%;
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    background:#eeeeee;
    overflow-x:hidden;
}

.topbar{
    height:42px;
    background:linear-gradient(#596772,#252d33);
    color:white;
    font-size:18px;
    font-weight:bold;
    padding:9px 10px;
    border-bottom:1px solid #222;
}

.student-info{
    background:#dddddd;
    border:1px solid #aaaaaa;
    padding:8px 10px;
    font-weight:bold;
    font-size:14px;
    line-height:1.7;
}


/* =====================================================
   RESULTS WRAPPER
===================================================== */

#studentResults,
#adminResults{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}


/* =====================================================
   TABLE - أصغر
===================================================== */

.result-table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
    table-layout:fixed;
    direction:rtl;
    margin:0;
    background:#fff;
}

.result-table td,
.result-table th{
    border:1px solid #bfb7b5;
    height:29px;
    padding:3px;
    text-align:center;
    font-size:11px;
    vertical-align:middle;
}

.result-table th{
    font-weight:bold;
    background:#f4f4f4;
}

.subject{
    width:27%;
    text-align:right!important;
    padding-right:8px!important;
}

.space{
    width:8%;
    background:#eeeeee;
}

.score{
    width:11%;
}

.max{
    width:10%;
}

.grade{
    width:8.5%;
}

.year{
    background:#ff6659!important;
    color:#111;
    font-weight:bold;
    font-size:13px!important;
    height:32px!important;
}

.total{
    background:#c9bebc!important;
    font-weight:bold;
}

.total td{
    height:31px;
}

.general-total{
    background:#b7aaa7!important;
    font-weight:bold;
    font-size:13px!important;
}

.weak{
    background:#fff477!important;
}


/* =====================================================
   TOTAL BOX
===================================================== */

.overall-summary{
    min-width:850px;
    border:1px solid #aaa;
    border-top:0;
    background:#d4cecc;
    display:flex;
    justify-content:center;
    align-items:stretch;
    font-weight:bold;
}

.overall-summary-item{
    flex:1;
    text-align:center;
    padding:9px;
    border-left:1px solid #aaa;
}

.overall-summary-item:last-child{

}

.overall-summary-title{

    margin-bottom:4px;

/* =====================================================

/* =====================================================
   حساب المجموع
===================================================== */

function calculateStage(stage){

    if(
        stage.total !== undefined &&
        stage.total !== null &&
        String(stage.total).trim() !== ""
    ){

        return String(stage.total);

    }


    let total = 0;


    (stage.subjects || []).forEach(subject=>{

        const score =
            parseFloat(subject.score1);


        if(!isNaN(score)){

            total += score;

        }

    });


    if(total === 0){

        return "";

    }


    return Number.isInteger(total)
        ? String(total)
        : total
            .toFixed(2)
            .replace(/\.00$/,"");

}



/* =====================================================
   حساب التقدير الكلي للمرحلة
===================================================== */

    /*
       نحسب عدد المواد التي تقديرها ضعيف
    */

    let weakCount = 0;


    (stage.subjects || []).forEach(subject=>{

        const weak1 =
            String(subject.grade1 || "").trim() === "ضعيف";


        const weak2 =
            String(subject.grade2 || "").trim() === "ضعيف";


        /*
           المادة تنحسب مرة واحدة فقط
           حتى لو grade1 و grade2 الاثنين ضعيف
        */

        if(weak1 || weak2){

            weakCount++;

        }

    });


    /*
       أكثر من مادتين ضعيف = باق
    */

    if(weakCount > 2){

        return "باق";

    }


    /*
       مادتين ضعيف بالضبط = مواد
    */

    if(weakCount === 2){

        return "مواد";

    }


    /*
       إذا ماكو مادتين ضعيف
       نحسب التقدير الطبيعي
    */

    let total = 0;
    let max = 0;


    (stage.subjects || []).forEach(subject=>{

        const score =
            parseFloat(subject.score1);


        const maximum =
            parseFloat(subject.max1);


        if(!isNaN(score)){

            total += score;

        }


        if(!isNaN(maximum)){

            max += maximum;

        }

    });


    if(max <= 0){

        return "";

    }


    const percentage =
        (total / max) * 100;


    if(percentage >= 85){

        return "ممتاز";

    }


    if(percentage >= 75){

        return "جيد جدا";

    }


    if(percentage >= 65){

        return "جيد";

    }


    if(percentage >= 50){

        return "مقبول";

    }


    return "ضعيف";

}

/* =====================================================
   حماية النصوص
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function showStudent(){

    let html = "";


    let overallTotal = 0;


    results.forEach(stage=>{

        const stageTotal =
            calculateStage(stage);


        const stageGrade =
            calculateGrade(stage);


        const numericTotal =
            parseFloat(stageTotal);


        if(!isNaN(numericTotal)){

            overallTotal += numericTotal;

        }


        html += `

        <table class="result-table">

            <tr>

                <td
                    colspan="8"
                    class="year"
                >

                    ${escapeHTML(stage.name)}

                </td>

            </tr>


            <tr>

                <th class="subject">
                    اسم المادة
                </th>

                <th class="space"></th>

                <th class="score">
                    الدرجة المحصلة
                </th>

                <th class="max">
                    الدرجة الكلية
                </th>

                <th class="grade">
                    التقدير
                </th>

                <th class="score">
                    الدرجة المحصلة
                </th>

                <th class="max">
                    الدرجة الكلية
                </th>

                <th class="grade">
                    التقدير
                </th>

            </tr>

        `;


        if(
            stage.subjects &&
            stage.subjects.length
        ){

            stage.subjects.forEach(s=>{

                const weak =
                    (
                        s.grade1 === "ضعيف" ||
                        s.grade2 === "ضعيف" ||
                        s.highlight
                    )
                    ? "weak"
                    : "";


                html += `

                <tr class="${weak}">

                    <td class="subject">

                        ${escapeHTML(s.name)}

                    </td>


                    <td class="space"></td>


                    <td class="score">

                        ${escapeHTML(
                            s.score1 || ""
                        )}

                    </td>


                    <td class="max">

                        ${escapeHTML(
                            s.max1 || ""
                        )}

                    </td>


                    <td class="grade">

                        ${escapeHTML(
                            s.grade1 || ""
                        )}

                    </td>


                    <td class="score">

                        ${escapeHTML(
                            s.score2 || ""
                        )}

                    </td>


                    <td class="max">

                        ${escapeHTML(
                            s.max2 || ""
                        )}

                    </td>


                    <td class="grade">

                        ${escapeHTML(
                            s.grade2 || ""
                        )}

                    </td>

                </tr>

                `;

            });


            html += `

            <tr class="total">

                <td
                    colspan="2"
                    class="subject"
                >

                    المجموع الكلي

                </td>


                <td colspan="2">

                    ${escapeHTML(stageTotal)}

                </td>


                <td>

                    التقدير الكلي

                </td>


                <td colspan="3">

                    ${escapeHTML(stageGrade)}

                </td>

            </tr>

            `;

        }else{

            html += `

            <tr class="total">

                <td colspan="8">

                    لا توجد مواد مسجلة لهذه المرحلة

                </td>

            </tr>

            `;

        }


        html += `

        </table>

        `;

    });


    let formattedOverall = "";


    if(overallTotal !== 0){

        formattedOverall =
            Number.isInteger(overallTotal)
            ? String(overallTotal)
            : overallTotal
                .toFixed(2)
                .replace(/\.00$/,"");

    }


    /*
       فقط المجموع العام
       بدون عدد المراحل
    */

    html += `

        <div class="overall-summary">

            <div class="overall-summary-item">

                <span class="overall-summary-title">
                    المجموع الكلي لجميع المراحل
                </span>

                <span>
                    ${escapeHTML(formattedOverall)}
                </span>

            </div>

        </div>


        <div class="footer">

            هذه الصفحة لعرض النتيجة
            وليست شهادة رسمية

        </div>

    `;


    document
        .getElementById("studentResults")
        .innerHTML = html;

}

/* =====================================================
   إضافة مادة
===================================================== */

function addSubject(stageIndex){

    results[stageIndex]
        .subjects
        .push({

            name:"مادة جديدة",

            score1:"",
            max1:"",
            grade1:"",

            score2:"",
            max2:"",
            grade2:""

        });


    showAdmin();

}



/* =====================================================
   إضافة مرحلة
===================================================== */

function addStage(){

    const name =
        prompt(
            "اكتب اسم المرحلة الجديدة"
        );


    if(!name){
        return;
    }


    results.push({

        name:name,

        subjects:[]

    });


    showAdmin();

}



/* =====================================================
   إضافة مرحلة قبل مرحلة
===================================================== */

function insertStage(index){

    const name =
        prompt(
            "اكتب اسم المرحلة الجديدة"
        );


    if(!name){
        return;
    }


    results.splice(
        index,
        0,
        {
            name:name,
            subjects:[]
        }
    );


    showAdmin();

}



/* =====================================================
   حذف مرحلة
===================================================== */

function deleteStage(index){

    if(
        confirm(
            "هل تريد حذف هذه المرحلة؟"
        )
    ){

        results.splice(
            index,
            1
        );


        showAdmin();

    }

}

===================================================== */

function saveData(){

    try{

        /*
           نحذف التقدير القديم المحفوظ
           حتى يتم حسابه حسب عدد المواد الضعيفة
        */

        results.forEach(stage=>{

            delete stage.totalGrade;

        });


        localStorage.setItem(
            "resultsSystemData",
            JSON.stringify(results)
        );


        alert(
            "تم حفظ التعديلات بنجاح"
        );


        showAdmin();

    }

    catch(e){

        alert(
            "حدث خطأ أثناء الحفظ"
        );

    }

}
