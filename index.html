<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام النتائج</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eeeeee;
    font-family:Tahoma,Arial,sans-serif;
    color:#222;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:30px 25px;
    border-radius:14px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    text-align:center;
}

.login-box h1{
    margin:0 0 8px;
    font-size:25px;
}

.login-box p{
    color:#777;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:12px 20px;
    cursor:pointer;
    font-size:15px;
}

.btn-main{
    width:100%;
    background:#333;
    color:white;
}

.error{
    color:#d00;
    margin-top:15px;
    display:none;
}

/* ================= GENERAL ================= */

.page{
    max-width:1150px;
    margin:20px auto;
    background:white;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
}

.topbar{
    padding:15px 20px;
    background:#333;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topbar h2{
    margin:0;
    font-size:19px;
}

.logout{
    background:#fff;
    color:#222;
}

/* ================= STUDENT ================= */

.student-info{
    padding:18px;
    background:#f6f6f6;
}

.info-table{
    width:100%;
    border-collapse:collapse;
}

.info-table td{
    border:1px solid #aaa;
    padding:11px;
}

.info-label{
    background:#ddd;
    font-weight:bold;
    width:18%;
}

.stage{
    margin-top:18px;
}

.stage-title{
    background:#e56b5d;
    padding:11px;
    text-align:center;
    font-weight:bold;
    border:1px solid #aaa;
}

.result-table{
    width:100%;
    border-collapse:collapse;
}

.result-table th,
.result-table td{
    border:1px solid #aaa;
    padding:9px 6px;
    text-align:center;
    font-size:13px;
}

.result-table th{
    background:#ddd;
}

.subject{
    text-align:right!important;
}

.total{
    background:#e1dddd;
    font-weight:bold;
}

.note{
    padding:18px;
    text-align:center;
    color:#777;
}

/* ================= ADMIN ================= */

.admin-page{
    max-width:1200px;
    margin:15px auto;
    padding:10px;
}

.admin-box{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.admin-box h3{
    margin-top:0;
}

.admin-input{
    width:100%;
    padding:10px;
    margin:5px 0 10px;
    border:1px solid #bbb;
    border-radius:6px;
}

.admin-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.save{
    background:#198754;
    color:white;
}

.add{
    background:#0d6efd;
    color:white;
}

.delete{
    background:#dc3545;
    color:white;
}

.secondary{
    background:#777;
    color:white;
}

.admin-stage{
    border:1px solid #bbb;
    margin-bottom:15px;
    border-radius:8px;
    overflow:hidden;
}

.admin-stage-head{
    background:#eee;
    padding:12px;
}

.admin-stage-head input{
    width:100%;
    padding:9px;
    border:1px solid #bbb;
    border-radius:5px;
    margin-bottom:8px;
}

.admin-subject{
    padding:12px;
    border-top:1px solid #ddd;
}

.subject-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;
    gap:6px;
    align-items:center;
}

.subject-grid input{
    width:100%;
    padding:8px;
    border:1px solid #bbb;
    border-radius:5px;
}

.small-btn{
    padding:8px;
    border:0;
    border-radius:5px;
    cursor:pointer;
}

.status{
    margin-top:10px;
    color:#198754;
    font-weight:bold;
}

@media(max-width:700px){

    .page{
        margin:5px;
    }

    .result-table th,
    .result-table td{
        font-size:10px;
        padding:6px 3px;
    }

    .info-table td{
        font-size:11px;
        padding:7px 4px;
    }

    .info-label{
        width:20%;
    }

    .subject-grid{
        grid-template-columns:1fr 1fr;
    }

    .subject-grid input:first-child{
        grid-column:1 / -1;
    }

}

/* ================= PRINT ================= */

@media print{

    body{
        background:white;
    }

    .topbar,
    .logout,
    .note{
        display:none!important;
    }

    .page{
        box-shadow:none;
        margin:0;
    }

}

</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <h1>نظام النتائج</h1>

        <p>تسجيل الدخول</p>

        <input
            id="username"
            class="input"
            type="text"
            placeholder="اسم المستخدم">

        <input
            id="password"
            class="input"
            type="password"
            placeholder="كلمة المرور">

        <button
            class="btn btn-main"
            onclick="login()">
            تسجيل الدخول
        </button>

        <div id="loginError" class="error">
            اسم المستخدم أو كلمة المرور غير صحيحة
        </div>

    </div>

</div>


<!-- ================= STUDENT PAGE ================= -->

<div id="studentPage" class="hidden">

    <div class="page">

        <div class="topbar">

            <h2>نتيجة الطالب</h2>

            <button
                class="btn logout"
                onclick="logout()">
                تسجيل الخروج
            </button>

        </div>

        <div class="student-info">

            <table class="info-table">

                <tr>

                    <td class="info-label">
                        اسم الطالب
                    </td>

                    <td id="studentName">
                    </td>

                    <td class="info-label">
                        رقم الجلوس
                    </td>

                    <td id="studentSeat">
                    </td>

                </tr>

            </table>

        </div>

        <div id="studentResults"></div>

        <div class="note">
            صفحة عرض نتائج تجريبية وليست وثيقة رسمية.
        </div>

    </div>

</div>


<!-- ================= ADMIN PAGE ================= -->

<div id="adminPage" class="hidden">

    <div class="admin-page">

        <div class="topbar">

            <h2>لوحة إدارة النتائج</h2>

            <button
                class="btn logout"
                onclick="logout()">
                تسجيل الخروج
            </button>

        </div>


        <!-- STUDENT DATA -->

        <div class="admin-box">

            <h3>بيانات الطالب</h3>

            <label>اسم الطالب</label>

            <input
                id="adminName"
                class="admin-input">

            <label>رقم الجلوس</label>

            <input
                id="adminSeat"
                class="admin-input">

        </div>


        <!-- STAGES -->

        <div class="admin-box">

            <h3>المراحل والمواد</h3>

            <div id="adminStages"></div>

            <div class="admin-actions">

                <button
                    class="btn add"
                    onclick="addStage()">
                    + إضافة مرحلة
                </button>

                <button
                    class="btn save"
                    onclick="saveData()">
                    حفظ جميع التعديلات
                </button>

            </div>

            <div id="saveStatus" class="status"></div>

        </div>

    </div>

</div>


<script>

                },

                {

                },

                {

                }

/* =====================================================
   تحميل البيانات
   ===================================================== */

let data;

function loadData(){

    const saved =
        localStorage.getItem("resultsSystemData");

    if(saved){

        try{

            data = JSON.parse(saved);

        }catch(e){

            data = JSON.parse(
                JSON.stringify(defaultData)
            );

        }

    }else{

        data = JSON.parse(
            JSON.stringify(defaultData)
        );

    }

}


/* =====================================================
   LOGIN
   ===================================================== */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const error =
        document.getElementById("loginError");


    if(
        username === STUDENT_USERNAME &&
        password === STUDENT_PASSWORD
    ){

        showStudent();

        error.style.display="none";

        return;
    }


    if(
    username === "admin" &&
    password === "admin123"
){

    showAdmin();

    error.style.display="none";

    return;
}


    error.style.display="block";

}


/* =====================================================
   STUDENT
   ===================================================== */

function showStudent(){

    loadData();

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("adminPage")
        .classList.add("hidden");

    document.getElementById("studentPage")
        .classList.remove("hidden");


    document.getElementById("studentName")
        .textContent = data.name;

    document.getElementById("studentSeat")
        .textContent = data.seat;


    renderStudentResults();

}


/* =====================================================
   عرض النتيجة
   ===================================================== */

function renderStudentResults(){

    const container =
        document.getElementById("studentResults");

    container.innerHTML = "";


    data.stages.forEach((stage,index)=>{

        const stageDiv =
            document.createElement("div");

        stageDiv.className = "stage";


        let html = `

            <div class="stage-title">
                ${escapeHTML(stage.title)}
            </div>

            <table class="result-table">

                <thead>

                    <tr>

                        <th>اسم المادة</th>

                        <th></th>

                        <th>الدرجة المحصلة</th>

                        <th>الدرجة الكلية</th>

                        <th>التقدير</th>

                        <th>الدرجة المحصلة</th>

                        <th>الدرجة الكلية</th>

                        <th>التقدير</th>

                    </tr>

                </thead>

                <tbody>
        `;


        stage.subjects.forEach(subject=>{

            html += `

                <tr>

                    <td class="subject">
                        ${escapeHTML(subject.name)}
                    </td>

                    <td></td>

                    <td>${escapeHTML(subject.mark1)}</td>

                    <td>${escapeHTML(subject.total1)}</td>

                    <td>${escapeHTML(subject.grade1)}</td>

                    <td>${escapeHTML(subject.mark2)}</td>

                    <td>${escapeHTML(subject.total2)}</td>

                    <td>${escapeHTML(subject.grade2)}</td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        stageDiv.innerHTML = html;

        container.appendChild(stageDiv);

    });

}


/* =====================================================
   ADMIN
   ===================================================== */

function showAdmin(){

    loadData();

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("studentPage")
        .classList.add("hidden");

    document.getElementById("adminPage")
        .classList.remove("hidden");


    document.getElementById("adminName")
        .value = data.name;

    document.getElementById("adminSeat")
        .value = data.seat;


    renderAdmin();

}


/* =====================================================
   ADMIN STAGES
   ===================================================== */

function renderAdmin(){

    const container =
        document.getElementById("adminStages");

    container.innerHTML = "";


    data.stages.forEach((stage,stageIndex)=>{

        const box =
            document.createElement("div");

        box.className = "admin-stage";


        let html = `

            <div class="admin-stage-head">

                <input
                    value="${escapeAttribute(stage.title)}"
                    onchange="updateStageTitle(${stageIndex},this.value)"
                    placeholder="اسم المرحلة">

                <div class="admin-actions">

                    <button
                        class="btn add"
                        onclick="addSubject(${stageIndex})">
                        + إضافة مادة
                    </button>

                    <button
                        class="btn secondary"
                        onclick="moveStageUp(${stageIndex})">
                        ↑
                    </button>

                    <button
                        class="btn secondary"
                        onclick="moveStageDown(${stageIndex})">
                        ↓
                    </button>

                    <button
                        class="btn delete"
                        onclick="deleteStage(${stageIndex})">
                        حذف المرحلة
                    </button>

                </div>

            </div>

        `;


        stage.subjects.forEach((subject,subjectIndex)=>{

            html += `

                <div class="admin-subject">

                    <div class="subject-grid">

                        <input
                            value="${escapeAttribute(subject.name)}"
                            placeholder="اسم المادة"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'name',this.value)">

                        <input
                            value="${escapeAttribute(subject.mark1)}"
                            placeholder="المحصلة 1"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'mark1',this.value)">

                        <input
                            value="${escapeAttribute(subject.total1)}"
                            placeholder="الكلية 1"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'total1',this.value)">

                        <input
                            value="${escapeAttribute(subject.grade1)}"
                            placeholder="التقدير 1"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'grade1',this.value)">

                        <input
                            value="${escapeAttribute(subject.mark2)}"
                            placeholder="المحصلة 2"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'mark2',this.value)">

                        <input
                            value="${escapeAttribute(subject.total2)}"
                            placeholder="الكلية 2"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'total2',this.value)">

                        <input
                            value="${escapeAttribute(subject.grade2)}"
                            placeholder="التقدير 2"
                            onchange="updateSubject(${stageIndex},${subjectIndex},'grade2',this.value)">

                    </div>

                    <button
                        class="small-btn delete"
                        onclick="deleteSubject(${stageIndex},${subjectIndex})">
                        حذف المادة
                    </button>

                </div>

            `;

        });


        box.innerHTML = html;

        container.appendChild(box);

    });

}


/* =====================================================
   تعديل المرحلة
   ===================================================== */

function updateStageTitle(index,value){

    data.stages[index].title = value;

}


/* =====================================================
   تعديل مادة
   ===================================================== */

function updateSubject(stageIndex,subjectIndex,key,value){

    data.stages[stageIndex]
        .subjects[subjectIndex][key] = value;

}


/* =====================================================
   إضافة مادة
   ===================================================== */

function addSubject(stageIndex){

    data.stages[stageIndex].subjects.push({

        name:"مادة جديدة",

        mark1:"",
        total1:"",
        grade1:"",

        mark2:"",
        total2:"",
        grade2:""

    });

    renderAdmin();

}


/* =====================================================
   حذف مادة
   ===================================================== */

function deleteSubject(stageIndex,subjectIndex){

    if(
        confirm("هل تريد حذف هذه المادة؟")
    ){

        data.stages[stageIndex]
            .subjects.splice(subjectIndex,1);

        renderAdmin();

    }

}


/* =====================================================
   إضافة مرحلة
   ===================================================== */

function addStage(){

    const newStage = {

        title:"مرحلة جديدة",

        subjects:[

            {

                name:"مادة جديدة",

                mark1:"",
                total1:"",
                grade1:"",

                mark2:"",
                total2:"",
                grade2:""

            }

        ]

    };


    data.stages.push(newStage);

    renderAdmin();

}


/* =====================================================
   حذف مرحلة
   ===================================================== */

function deleteStage(index){

    if(
        confirm("هل تريد حذف هذه المرحلة؟")
    ){

        data.stages.splice(index,1);

        renderAdmin();

    }

}


/* =====================================================
   تحريك المرحلة للأعلى
   ===================================================== */

function moveStageUp(index){

    if(index === 0) return;

    const temp =
        data.stages[index-1];

    data.stages[index-1] =
        data.stages[index];

    data.stages[index] =
        temp;

    renderAdmin();

}


/* =====================================================
   تحريك المرحلة للأسفل
   ===================================================== */

function moveStageDown(index){

    if(
        index >= data.stages.length - 1
    ) return;


    const temp =
        data.stages[index+1];

    data.stages[index+1] =
        data.stages[index];

    data.stages[index] =
        temp;

    renderAdmin();

}


/* =====================================================
   حفظ
   ===================================================== */

function saveData(){

    data.name =
        document.getElementById("adminName").value.trim();

    data.seat =
        document.getElementById("adminSeat").value.trim();


    localStorage.setItem(
        "resultsSystemData",
        JSON.stringify(data)
    );


    document.getElementById("saveStatus")
        .textContent =
        "✓ تم حفظ جميع التعديلات";


    setTimeout(()=>{

        document.getElementById("saveStatus")
            .textContent = "";

    },3000);

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    document.getElementById("studentPage")
        .classList.add("hidden");

    document.getElementById("adminPage")
        .classList.add("hidden");

    document.getElementById("loginPage")
        .classList.remove("hidden");


    document.getElementById("username").value="";
    document.getElementById("password").value="";

}


/* =====================================================
   حماية عرض النصوص
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}

</script>

</html>
